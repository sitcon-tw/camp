name: 'Submodules Sync and Copy 404.html'

on:
  workflow_dispatch:

jobs:
  sync:
    name: 'Submodules Sync'
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash

    steps:
    - name: Checkout
      uses: actions/checkout@v2
      with:
        submodules: false
        
    - name: Git Submodule Update
      run: |
        git submodule update --init --recursive
        git submodule update --recursive --remote

    - name: Find and Copy Latest 404.html
      run: |
        # Find submodule folders like 2025, 2024, etc.
        folders=$(find . -maxdepth 1 -type d -regex './[0-9]\{4\}')
        echo "Found folders: $folders"

        latest_file=""
        latest_mtime=0

        for dir in $folders; do
          if [ -f "$dir/404.html" ]; then
            # Get file modification time
            mtime=$(stat -c %Y "$dir/404.html")
            echo "$dir/404.html modified at $mtime"
            if [ "$mtime" -gt "$latest_mtime" ]; then
              latest_mtime=$mtime
              latest_file="$dir/404.html"
            fi
          fi
        done

        if [ -n "$latest_file" ]; then
          echo "Copying $latest_file to root as 404.html"
          cp "$latest_file" ./404.html
        else
          echo "No 404.html found in submodule folders."
        fi

    - name: Commit update
      run: |
        git config --global user.name 'GitHub bot'
        git config --global user.email 'bot@noreply.github.com'
        git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}

        if [ -n "$(git status --porcelain)" ]; then
          git add 404.html
          git commit -m "Auto updated 404.html from latest submodule"
          git push
        else
          echo "No changes to commit."
